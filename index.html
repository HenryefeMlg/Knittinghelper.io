<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Games – Knitting Helper</title>

<style>
:root{
  --bg:#0b0f0e;
  --main:#2ec4b6;
  --text:#e8f1ef;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
}

/* CONTROLS */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  border-bottom:1px solid var(--main);
}

.controls input,
.controls button{
  background:#000;
  color:var(--text);
  border:1px solid var(--main);
  padding:6px 8px;
}

button{ cursor:pointer; }

/* GRID */
.grid{ display:grid; padding:10px; }
.cell{ border:1px solid #000; }

/* VIEWER */
.viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  display:none;
}

.viewer.active{ display:block; }

.viewer-inner{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

#viewerGrid{
  display:grid;
  transform-origin:0 0;
  will-change:transform;
}

.cell.dim{ filter:brightness(.8); }
.cell.active{
  filter:brightness(1.3);
  box-shadow:0 0 6px rgba(46,196,182,.6);
}

/* BUTTONS */
.nav{
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  display:none;
  flex-direction:column;
  gap:10px;
  z-index:10;
}

.nav button,
.close{
  font-size:24px;
  padding:12px;
  background:#000;
  border:1px solid var(--main);
  color:var(--text);
  border-radius:10px;
}

.close{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  display:none;
}
</style>
</head>

<body>

<div class="controls">
  Pixel <input id="pixelSize" type="number" value="24">
  W <input id="gridW" type="number" value="20">
  H <input id="gridH" type="number" value="20">
  <input id="imgInput" type="file" accept="image/*">
  <button id="applyBtn">Uygula</button>
  <button id="viewBtn">Görüntüle</button>
</div>

<div id="grid" class="grid"></div>

<div id="viewer" class="viewer">
  <div id="viewerInner" class="viewer-inner">
    <div id="viewerGrid"></div>
  </div>
</div>

<div id="nav" class="nav">
  <button id="up">⬆️</button>
  <button id="down">⬇️</button>
</div>

<button id="close" class="close">❌ Kapat</button>

<script>
let pixels=[], imgCache=null, row=0;
let scale=1, x=0, y=0;
let startDist=0, startScale=1;
let sx=0, sy=0, dragging=false, raf=false;

const grid=document.getElementById("grid");
const viewer=document.getElementById("viewer");
const viewerGrid=document.getElementById("viewerGrid");
const viewerInner=document.getElementById("viewerInner");

function buildGrid(img){
  imgCache=img;
  const s=+pixelSize.value,w=+gridW.value,h=+gridH.value;
  grid.style.gridTemplateColumns=`repeat(${w},${s}px)`;
  grid.innerHTML="";
  pixels=[];

  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;

  for(let j=0;j<h;j++){
    pixels[j]=[];
    for(let i=0;i<w;i++){
      const k=(j*w+i)*4;
      const col=`rgb(${d[k]},${d[k+1]},${d[k+2]})`;
      pixels[j][i]=col;
      const el=document.createElement("div");
      el.className="cell";
      el.style=`width:${s}px;height:${s}px;background:${col}`;
      grid.appendChild(el);
    }
  }
}

function renderViewer(){
  const s=+pixelSize.value;
  viewerGrid.innerHTML="";
  viewerGrid.style.gridTemplateColumns=`repeat(${pixels[0].length},${s}px)`;

  pixels.forEach((r,y)=>{
    r.forEach(col=>{
      const d=document.createElement("div");
      d.className="cell "+(y===row?"active":"dim");
      d.style=`width:${s}px;height:${s}px;background:${col}`;
      viewerGrid.appendChild(d);
    });
  });
}

function transform(){
  if(raf) return;
  raf=true;
  requestAnimationFrame(()=>{
    viewerGrid.style.transform=
      `translate3d(${x}px,${y}px,0) scale(${scale})`;
    raf=false;
  });
}

/* INPUT */
imgInput.onchange=()=>{
  const img=new Image();
  img.onload=()=>buildGrid(img);
  img.src=URL.createObjectURL(imgInput.files[0]);
};
applyBtn.onclick=()=>imgCache&&buildGrid(imgCache);

/* VIEW */
viewBtn.onclick=()=>{
  viewer.classList.add("active");
  nav.style.display="flex";
  close.style.display="block";
  row=0; scale=1; x=0; y=0;
  renderViewer(); transform();
};

close.onclick=()=>{
  viewer.classList.remove("active");
  nav.style.display="none";
  close.style.display="none";
};

/* ROW */
up.onclick=()=>{ if(row>0){row--;renderViewer();} };
down.onclick=()=>{ if(row<pixels.length-1){row++;renderViewer();} };

/* TOUCH */
viewerInner.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    startDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    startScale=scale;
  }
  if(e.touches.length===1){
    dragging=true;
    sx=e.touches[0].clientX-x;
    sy=e.touches[0].clientY-y;
  }
});

viewerInner.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    scale=Math.min(3,Math.max(.7,startScale*d/startDist));
  }
  if(dragging && e.touches.length===1){
    x=e.touches[0].clientX-sx;
    y=e.touches[0].clientY-sy;
  }
  transform();
},{passive:true});

viewerInner.addEventListener("touchend",()=>dragging=false);
</script>

</body>
</html>
