<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Games – Knitting Helper</title>

<style>
:root{
  --bg:#0b0f0e;
  --main:#2ec4b6;
  --text:#e8f1ef;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid var(--main);
}

header img{ height:44px; }

header h1{
  margin:0;
  font-size:1.1rem;
  letter-spacing:2px;
  color:var(--main);
}

header small{ color:#9adbd3; }

/* CONTROLS */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:#0f1615;
}

.controls input,
.controls button{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--main);
  padding:6px 8px;
}

.controls button{ cursor:pointer; }

/* GRID */
.workspace{ padding:10px; overflow:auto; }
.grid{ display:grid; }
.cell{ border:1px solid #000; }

/* VIEWER */
.viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  overflow:hidden;
}

.viewer.active{ display:block; }

.viewer-inner{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

#viewerGrid{
  display:grid;
  transform-origin:0 0;
}

/* SATIR */
.cell.dim{ filter:brightness(.8); }
.cell.active{
  filter:brightness(1.3);
  box-shadow:0 0 6px rgba(46,196,182,.6);
}

/* MOBİL BUTONLAR */
.nav-buttons{
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  display:none;
  flex-direction:column;
  gap:10px;
  z-index:10;
}

.nav-buttons button,
.close-mobile{
  font-size:26px;
  padding:12px;
  background:var(--bg);
  border:1px solid var(--main);
  color:var(--text);
  border-radius:10px;
}

.close-mobile{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
}
</style>
</head>

<body>

<header>
  <h1>HENRY GAMES <small>KNITTING HELPER</small></h1>
</header>

<div class="controls">
  Pixel Büyüklüğü<input type="number" id="pixelSize" value="24">
 En (Pixel) <input type="number" id="gridW" value="20">
  Boy (Pixel) (alttaki)<input type="number" id="gridH" value="20">
  <input type="file" id="imgInput" accept="image/*">
  <button id="applyBtn">Uygula</button>
  <button id="viewBtn">Görüntüle</button>
</div>

<div class="workspace">
  <div id="grid" class="grid"></div>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-inner" id="viewerInner">
    <div id="viewerGrid"></div>
  </div>
</div>

<div class="nav-buttons" id="navButtons">
  <button id="upBtn">⬆️</button>
  <button id="downBtn">⬇️</button>
</div>

<button class="close-mobile" id="closeMobile">❌</button>

<script>
let pixels=[], currentRow=0, lastImg=null;
let scale=1, posX=0, posY=0;
let startDist=0, startScale=1;
let startX=0, startY=0, dragging=false;

const grid=document.getElementById("grid");
const viewer=document.getElementById("viewer");
const viewerGrid=document.getElementById("viewerGrid");
const viewerInner=document.getElementById("viewerInner");
const navButtons=document.getElementById("navButtons");

function buildGrid(img){
  lastImg=img;
  const size=+pixelSize.value;
  const w=+gridW.value;
  const h=+gridH.value;
  grid.style.gridTemplateColumns=`repeat(${w},${size}px)`;
  grid.innerHTML="";
  pixels=[];

  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(img,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h).data;

  for(let y=0;y<h;y++){
    pixels[y]=[];
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const col=`rgb(${data[i]},${data[i+1]},${data[i+2]})`;
      pixels[y][x]=col;
      const d=document.createElement("div");
      d.className="cell";
      d.style.width=size+"px";
      d.style.height=size+"px";
      d.style.background=col;
      grid.appendChild(d);
    }
  }
}

function renderViewer(){
  viewerGrid.innerHTML="";
  const size=+pixelSize.value;
  viewerGrid.style.gridTemplateColumns=
    `repeat(${pixels[0].length},${size}px)`;

  pixels.forEach((row,y)=>{
    row.forEach(col=>{
      const d=document.createElement("div");
      d.className="cell "+(y===currentRow?"active":"dim");
      d.style.width=size+"px";
      d.style.height=size+"px";
      d.style.background=col;
      viewerGrid.appendChild(d);
    });
  });
  applyTransform();
}

function applyTransform(){
  viewerGrid.style.transform=
    `translate(${posX}px,${posY}px) scale(${scale})`;
}

imgInput.onchange=()=>{
  const img=new Image();
  img.onload=()=>buildGrid(img);
  img.src=URL.createObjectURL(imgInput.files[0]);
};

applyBtn.onclick=()=>lastImg&&buildGrid(lastImg);

viewBtn.onclick=()=>{
  viewer.classList.add("active");
  navButtons.style.display="flex";
  document.getElementById("closeMobile").style.display="block";
  scale=1; posX=0; posY=0;
  currentRow=0;
  renderViewer();
};

closeMobile.onclick=()=>{
  viewer.classList.remove("active");
  navButtons.style.display="none";
  closeMobile.style.display="none";
};

upBtn.onclick=()=>{ if(currentRow>0){currentRow--;renderViewer();}};
downBtn.onclick=()=>{ if(currentRow<pixels.length-1){currentRow++;renderViewer();}};

/* TOUCH ZOOM + PAN */
viewerInner.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    startDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    startScale=scale;
  }
  if(e.touches.length===1){
    dragging=true;
    startX=e.touches[0].clientX-posX;
    startY=e.touches[0].clientY-posY;
  }
});

viewerInner.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    scale=Math.min(4,Math.max(.5,startScale*dist/startDist));
  }
  if(dragging && e.touches.length===1){
    posX=e.touches[0].clientX-startX;
    posY=e.touches[0].clientY-startY;
  }
  applyTransform();
},{passive:false});

viewerInner.addEventListener("touchend",()=>dragging=false);

/* MOUSE ZOOM */
viewerInner.addEventListener("wheel",e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(4,Math.max(.5,scale));
  applyTransform();
},{passive:false});
</script>

</body>
</html>
